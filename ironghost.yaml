mission:
  assessment:
    budget: 2

artifact_store:
  root: ./data/artifacts

source_store:
  root: ./data/sources
  max_size_mb: 10

agents:
  strategist:
    socket: /tmp/agent_strategist.sock

workers:
  worker-code:
    socket: /tmp/worker_code.sock
  worker-observation:
    socket: /tmp/worker_observation.sock
  worker-knowledge:
    socket: /tmp/worker_knowledge.sock

sentinels:
  sentinel-code:
    socket: /tmp/sentinel_code.sock
  sentinel-observation:
    socket: /tmp/sentinel_observation.sock
  sentinel-knowledge:
    socket: /tmp/sentinel_knowledge.sock

observers:
  web_search:
    provider: brave

executors:
  executor_orchestrator:
    socket: /tmp/executor.sock