artifact_store:
  root: ./data/artifacts

source_store:
  root: ./data/sources
  max_size_mb: 10

agents:
  strategist:
    socket: /tmp/agent_strategist.sock

  generic:
    socket: /tmp/agent_generic.sock

workers:
  coder:
    socket: /tmp/agent_coder.sock
  worker-generic:
    socket: /tmp/worker_generic.sock
  worker-knowledge:
    socket: /tmp/worker_knowledge.sock

sentinels:
  sentinel-code:
    socket: /tmp/sentinel_code.sock
  sentinel-generic:
    socket: /tmp/sentinel_generic.sock
  sentinel-knowledge:
    socket: /tmp/sentinel_knowledge.sock

observers:
  web_search:
    provider: brave

executors:
  executor_orchestrator:
    socket: /tmp/executor.sock